# Regenera las efemerides de los 3 sitios desde JPL Horizons y publica el resultado.
# El navegador no puede consultar Horizons directamente (la API no permite CORS),
# por eso la consulta se hace aqui y la demo sigue leyendo archivos estaticos.
#
# Uso: pestana Actions > "Efemerides JPL Horizons" > Run workflow.
# Ademas corre sola cada lunes con el periodo por defecto (dic 2026 completo: 31 dias, 744 h).
# Si algo falla (Horizons caido, datos incompletos, pruebas rojas) no se sube nada.
name: Efemerides JPL Horizons

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: Primer dia del periodo, en UTC (YYYY-MM-DD)
        required: true
        default: "2026-12-01"
      dias:
        description: Numero de dias (1 a 366)
        required: true
        default: "31"
  schedule:
    - cron: "17 13 * * 1"   # lunes 13:17 UTC (06:17 en Hermosillo)

permissions:
  contents: write

concurrency:
  group: efemerides
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validar parametros
        env:
          INICIO: ${{ inputs.inicio || '2026-12-01' }}
          DIAS: ${{ inputs.dias || '31' }}
        run: |
          [[ "$INICIO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::inicio debe ser YYYY-MM-DD"; exit 1; }
          [[ "$DIAS" =~ ^[0-9]+$ ]] || { echo "::error::dias debe ser un numero entero"; exit 1; }

      - name: Consultar JPL Horizons
        env:
          INICIO: ${{ inputs.inicio || '2026-12-01' }}
          DIAS: ${{ inputs.dias || '31' }}
        run: python3 scripts/efemerides.py --todos --inicio "$INICIO" --dias "$DIAS"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar datos con las reglas de la demo
        run: npm run validar

      - name: Recompilar la demo y el HTML sin conexion
        run: npm run empaquetar

      - name: Pruebas
        run: npm test

      - name: Publicar en el repositorio
        env:
          INICIO: ${{ inputs.inicio || '2026-12-01' }}
          DIAS: ${{ inputs.dias || '31' }}
        run: |
          git add data/shackleton.json data/de_gerlache.json data/malapert.json web/build dist
          if git diff --cached --quiet; then
            echo "Horizons devolvio exactamente los mismos datos; no hay nada que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "datos: efemerides JPL Horizons $INICIO (+$DIAS dias)"
          git push
