<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Landing Site Navigator</title>
<style>
  :root {
    --bg: #0b0e17;
    --panel: #141a2a;
    --texto: #e8ecf4;
    --sub: #9aa4bd;
    --borde: #262e45;
    --rapido: #3ddc84;
    --robusto: #f5c542;
    --sin-enlace: #ef4b4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--texto);
  }
  header {
    padding: 1.5rem 1.5rem 0.5rem;
  }
  header h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
  header p { margin: 0; color: var(--sub); font-size: 0.9rem; }
  main {
    padding: 1rem 1.5rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .controles {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 1.5rem;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 1rem;
  }
  .controles label {
    display: flex;
    flex-direction: column;
    font-size: 0.8rem;
    color: var(--sub);
    gap: 0.3rem;
  }
  select, input {
    background: var(--bg);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-size: 0.95rem;
  }
  .sitios {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1rem;
  }
  .sitio-card {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 1rem;
  }
  .sitio-card h2 {
    margin: 0 0 0.75rem;
    font-size: 1.05rem;
  }
  .franja {
    margin-bottom: 0.6rem;
  }
  .franja-titulo {
    font-size: 0.75rem;
    color: var(--sub);
    margin-bottom: 0.2rem;
    display: flex;
    justify-content: space-between;
  }
  .franja-barra {
    display: flex;
    height: 14px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--borde);
  }
  .franja-barra span { height: 100%; }
  .leyenda {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.75rem;
    color: var(--sub);
    margin-top: 1.5rem;
  }
  .leyenda i {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 0.35rem;
    vertical-align: middle;
  }
  .estado-vacio {
    color: var(--sub);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<header>
  <h1>Lunar Landing Site Navigator</h1>
  <p>Comparacion de sitios de aterrizaje del polo sur lunar: energia solar, ventana de
     comunicacion directa a Tierra, y enlace local de respaldo (RF u optico).</p>
</header>
<main>
  <div class="controles">
    <label>
      Fecha
      <input type="date" id="selector-fecha">
    </label>
    <label>
      Hora
      <input type="range" id="selector-hora" min="0" max="23" value="12" step="1">
      <span id="valor-hora">12:00</span>
    </label>
    <label>
      Tipo de enlace local
      <select id="selector-enlace">
        <option value="rf">Radiofrecuencia (LunaNet)</option>
        <option value="optico">Optico (tipo O2O)</option>
      </select>
    </label>
  </div>

  <div class="sitios" id="contenedor-sitios">
    <p class="estado-vacio">Cargando datos...</p>
  </div>

  <div class="leyenda">
    <span><i style="background: var(--rapido)"></i>Rapido / Sol visible / Tierra visible</span>
    <span><i style="background: var(--robusto)"></i>Robusto / marginal</span>
    <span><i style="background: var(--sin-enlace)"></i>Sin enlace / sin Sol / sin Tierra</span>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
