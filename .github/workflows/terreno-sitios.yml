# Variables de terreno de los tres sitios (pendiente, rugosidad, ruta de
# aproximación, distancia a sombra permanente) con productos LOLA de 20 m de
# NASA PGDA. Descarga los tres productos (unos 3.4 GB; el servidor no responde
# bien a lecturas por partes) y los guarda en cache entre corridas; calcula con
# scripts/terreno_sitios.py y sube data/terreno_sitios.json.
#
# Uso: pestaña Actions > "Terreno de los sitios (LOLA)" > Run workflow.
name: Terreno de los sitios (LOLA)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terreno-sitios
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASE: https://pgda.gsfc.nasa.gov/data/LOLA_20mpp
      ARCHIVOS: LDEM_80S_20MPP_ADJ.TIF LPSR_80S_20MPP_ADJ.TIF LDRM_80S_50MPP_ADJ_ROUGH_100M.TIF
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Productos LOLA en cache
        id: cache-lola
        uses: actions/cache@v5
        with:
          path: lola
          key: lola-20mpp-dem-psr-rough100-v1

      - name: Descargar productos de NASA PGDA
        if: steps.cache-lola.outputs.cache-hit != 'true'
        run: |
          mkdir -p lola
          for f in $ARCHIVOS; do
            curl -fL --retry 5 --retry-delay 15 -o "lola/$f" "$BASE/$f"
            echo "$f: $(stat -c %s "lola/$f") bytes"
          done

      - name: Revisar el mapa de sombra permanente
        run: |
          python3 - <<'EOF'
          import numpy as np, rasterio
          from rasterio.windows import Window
          with rasterio.open("lola/LPSR_80S_20MPP_ADJ.TIF") as ds:
              print("LPSR", ds.dtypes, "nodata", ds.nodata, "tamano", ds.width, ds.height, "paso", ds.transform.a)
              f, c = ds.index(0, 0)
              v = ds.read(1, window=Window(c - 500, f - 500, 1000, 1000))
              fin = np.isfinite(v)
              u, n = np.unique(v[fin], return_counts=True)
              print("NaN:", int((~fin).sum()), "valores:", dict(zip(u.tolist()[:20], n.tolist()[:20])))
          EOF

      - name: Calcular variables de terreno
        run: |
          python3 scripts/terreno_sitios.py \
            --dem lola/LDEM_80S_20MPP_ADJ.TIF \
            --psr lola/LPSR_80S_20MPP_ADJ.TIF \
            --rugosidad lola/LDRM_80S_50MPP_ADJ_ROUGH_100M.TIF
          cat data/terreno_sitios.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validar, recompilar el HTML sin conexion y probar
        run: |
          npm ci
          npm run validar
          npm run empaquetar
          npm test

      - name: Publicar en el repositorio
        run: |
          git add data/terreno_sitios.json web/build dist
          if git diff --cached --quiet; then
            echo "El terreno no cambio; no hay nada que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "datos: variables de terreno LOLA de los sitios"
          git pull --rebase
          git push
